<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑞士轮晋级图 - VR斗虫大赛 2026</title>
    <style>
        :root {
            --bg-deepest: #05070C;
            --bg-deep: #0A0D12;
            --bg-mid: #0F131C;
            --bg-elevated: #161D2B;
            --bg-highest: #1E2636;
            --accent: #38BDF8;
            --accent-dim: #0EA5E9;
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --border: #334155;
            --success: #6EE7B7;
            --warning: #FBBF24;
            --danger: #F87171;
            --eliminated: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-deepest);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: auto;
        }

        .container {
            max-width: 2000px;
            margin: 0 auto;
            padding: clamp(1rem, 3vw, 2rem);
        }

        header {
            text-align: center;
            padding: clamp(2rem, 5vw, 3rem) 0;
            background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-deepest) 100%);
            border-bottom: 2px solid var(--accent);
            margin-bottom: 2rem;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent) 0%, var(--text-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stage-title {
            font-size: clamp(1rem, 2vw, 1.25rem);
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin: 1rem 0 2rem;
            flex-wrap: wrap;
        }

        nav a {
            padding: 0.75rem 1.5rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 999px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        nav a:hover, nav a.active {
            background: var(--accent);
            color: var(--bg-deepest);
            border-color: var(--accent);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 2rem;
            padding: 1rem;
            background: var(--bg-mid);
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .legend-box {
            width: 24px;
            height: 24px;
            border-radius: 4px;
        }

        .legend-box.qualified { background: var(--success); }
        .legend-box.eliminated { background: var(--eliminated); }
        .legend-box.active { background: var(--accent); }
        .legend-box.pending { background: var(--bg-elevated); border: 2px solid var(--border); }

        /* 瑞士轮流程图 */
        .swiss-flow {
            position: relative;
            min-width: 1800px;
            padding: 2rem;
            background: var(--bg-mid);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        .rounds-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3rem;
            margin-bottom: 3rem;
        }

        .round-column {
            position: relative;
        }

        .round-header {
            text-align: center;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .round-matches {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .bracket-match {
            background: var(--bg-elevated);
            border-radius: 8px;
            border: 2px solid var(--border);
            padding: 0.75rem;
            min-height: 120px;
            transition: all 0.2s ease;
        }

        .bracket-match:hover {
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .bracket-match.completed {
            opacity: 0.9;
        }

        .match-player {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            margin: 0.25rem 0;
            background: var(--bg-mid);
            border-radius: 6px;
            border: 2px solid transparent;
        }

        .match-player.winner {
            border-color: var(--success);
            background: linear-gradient(90deg, var(--bg-mid) 0%, rgba(110, 231, 183, 0.1) 100%);
        }

        .match-player.qualified {
            border-color: var(--success);
            background: linear-gradient(90deg, rgba(110, 231, 183, 0.2) 0%, rgba(110, 231, 183, 0.05) 100%);
        }

        .match-player.eliminated {
            border-color: var(--eliminated);
            opacity: 0.6;
            background: var(--bg-deepest);
        }

        .player-avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            overflow: hidden;
            flex-shrink: 0;
        }

        .player-avatar-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .player-name-small {
            font-size: 0.875rem;
            font-weight: 600;
            flex: 1;
        }

        .player-record {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .player-record.qualified {
            color: var(--success);
        }

        .player-record.eliminated {
            color: var(--danger);
        }

        .vs-small {
            text-align: center;
            font-size: 0.625rem;
            color: var(--text-secondary);
            margin: 0.125rem 0;
        }

        /* 晋级/淘汰区域 */
        .results-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        .result-section {
            background: var(--bg-elevated);
            border-radius: 12px;
            padding: 1.5rem;
            border: 2px solid var(--border);
        }

        .result-section.qualified {
            border-color: var(--success);
        }

        .result-section.eliminated {
            border-color: var(--eliminated);
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .result-title.qualified { color: var(--success); }
        .result-title.eliminated { color: var(--eliminated); }

        .result-list {
            display: grid;
            gap: 0.75rem;
        }

        .result-player {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem;
            background: var(--bg-mid);
            border-radius: 8px;
            border: 2px solid var(--border);
        }

        .result-player.qualified {
            border-color: var(--success);
            background: linear-gradient(90deg, var(--bg-mid) 0%, rgba(110, 231, 183, 0.1) 100%);
        }

        .result-player.eliminated {
            border-color: var(--eliminated);
            opacity: 0.7;
        }

        .result-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            overflow: hidden;
        }

        .result-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .result-info {
            flex: 1;
        }

        .result-name {
            font-size: 1.125rem;
            font-weight: 700;
        }

        .result-record {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .result-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .result-badge.q30 { background: #10B981; color: white; }
        .result-badge.q31 { background: #6EE7B7; color: var(--bg-deepest); }
        .result-badge.q32 { background: #A7F3D0; color: var(--bg-deepest); }
        .result-badge.e03 { background: var(--danger); color: white; }
        .result-badge.e13 { background: var(--eliminated); color: white; }
        .result-badge.e23 { background: #64748B; color: white; }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 3rem;
        }
    
.data-license {
    width: min(1100px, 94%);
    margin: 28px auto 0;
    padding: 16px 20px;
    color: #9aaabd;
    background: #101722;
    border: 1px solid #33445a;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.8;
    text-align: center;
}

.data-license strong {
    color: #eef4fb;
}

.data-license a {
    color: #38bdf8;
    text-decoration: none;
}

.data-license a:hover {
    text-decoration: underline;
}

.data-license code {
    color: #d7e3f1;
    background: #182231;
    padding: 2px 5px;
    border-radius: 4px;
}
</style>
</head>
<body>
    <header>
        <h1>VR斗虫大赛 2026</h1>
        <p class="stage-title">瑞士轮晋级路线图</p>
    </header>

    <div class="container">
        <nav>
            <a href="swiss.html">比赛详情</a>
            <a href="swiss_bracket.html" class="active">晋级路线图</a>
            <a href="playoffs.html">淘汰赛</a>
        </nav>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-box qualified"></div>
                <span>已晋级</span>
            </div>
            <div class="legend-item">
                <div class="legend-box eliminated"></div>
                <span>已淘汰</span>
            </div>
            <div class="legend-item">
                <div class="legend-box active"></div>
                <span>进行中</span>
            </div>
            <div class="legend-item">
                <div class="legend-box pending"></div>
                <span>未开始</span>
            </div>
        </div>

        <div class="swiss-flow">
            <div class="rounds-container" id="rounds-container">
                <!-- 动态生成5轮比赛 -->
            </div>

            <div class="results-area">
                <div class="result-section qualified">
                    <div class="result-title qualified">✅ 晋级八强 (8人)</div>
                    <div class="result-list" id="qualified-list"></div>
                </div>
                <div class="result-section eliminated">
                    <div class="result-title eliminated">❌ 淘汰 (8人)</div>
                    <div class="result-list" id="eliminated-list"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
    <p>VR斗虫大赛 2026 · 非商业兴趣项目</p>
    
<div class="data-license">
    <strong>数据来源与许可声明</strong><br>

    本网站部分直播数据来自
    <a
        href="https://github.com/qianqiuzy/VR_douchong"
        target="_blank"
        rel="noopener noreferrer"
    >
        VR_douchong
    </a>
    项目及其相关数据接口
    <code>vr.qianqiuzy.cn</code> /
    <code>psp.qianqiuzy.cn</code>。<br>

    数据许可说明请参阅
    <a
        href="https://github.com/qianqiuzy/VR_douchong/blob/main/LICENSE-DATA.md"
        target="_blank"
        rel="noopener noreferrer"
    >
        LICENSE-DATA.md
    </a>。<br>

    本网站仅用于非商业兴趣展示和赛事娱乐用途。
    如需将相关数据用于商业宣传、商业服务、广告、
    付费服务或其他商业目的，请先取得数据权利人授权。
</div>

</footer>

    <script>
        const API_BASE = '/api/tournament';
        const TOURNAMENT_ID = 1;

        let currentData = null;

        function getAvatarUrl(player) {
            if (!player) return '';
            const jpgPlayers = ['Rhea', 'Melody'];
            const ext = jpgPlayers.includes(player.name) ? 'jpg' : 'webp';
            return `/static/avatars/${player.name}.${ext}`;
        }

        function getPlayerStatus(player) {
            if (player.wins >= 3) return 'qualified';
            if (player.losses >= 3) return 'eliminated';
            return 'active';
        }

        function getBadgeText(wins, losses) {
            if (wins >= 3) {
                if (wins === 3 && losses === 0) return { text: '3-0晋级', class: 'q30' };
                if (wins === 3 && losses === 1) return { text: '3-1晋级', class: 'q31' };
                if (wins === 3 && losses === 2) return { text: '3-2晋级', class: 'q32' };
            }
            if (losses >= 3) {
                if (losses === 3 && wins === 0) return { text: '0-3淘汰', class: 'e03' };
                if (losses === 3 && wins === 1) return { text: '1-3淘汰', class: 'e13' };
                if (losses === 3 && wins === 2) return { text: '2-3淘汰', class: 'e23' };
            }
            return null;
        }

        function renderSwissBracket(data) {
            const container = document.getElementById('rounds-container');
            container.innerHTML = '';

            // 按轮次分组比赛
            const matchesByRound = {};
            data.matches.filter(m => m.round < 100).forEach(match => {
                if (!matchesByRound[match.round]) matchesByRound[match.round] = [];
                matchesByRound[match.round].push(match);
            });

            // 渲染5轮
            for (let round = 1; round <= 5; round++) {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'round-column';

                const header = document.createElement('div');
                header.className = 'round-header';
                header.textContent = `第 ${round} 轮`;
                roundDiv.appendChild(header);

                const matchesDiv = document.createElement('div');
                matchesDiv.className = 'round-matches';

                const roundMatches = matchesByRound[round] || [];
                
                if (roundMatches.length === 0) {
                    matchesDiv.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:2rem;">未开始</div>';
                } else {
                    roundMatches.forEach(match => {
                        const p1 = data.players.find(p => p.id === match.p1);
                        const p2 = data.players.find(p => p.id === match.p2);

                        if (!p1 || !p2) return;

                        const p1Status = getPlayerStatus(p1);
                        const p2Status = getPlayerStatus(p2);

                        const matchDiv = document.createElement('div');
                        matchDiv.className = 'bracket-match';
                        if (match.status === 'completed') matchDiv.classList.add('completed');

                        matchDiv.innerHTML = `
                            <div class="match-player ${match.winner === p1.id ? 'winner' : ''} ${p1Status}">
                                <div class="player-avatar-small">
                                    <img src="${getAvatarUrl(p1)}" alt="${p1.name}">
                                </div>
                                <div class="player-name-small">${p1.name}</div>
                                <div class="player-record ${p1Status}">${p1.wins}-${p1.losses}</div>
                            </div>
                            <div class="vs-small">VS</div>
                            <div class="match-player ${match.winner === p2.id ? 'winner' : ''} ${p2Status}">
                                <div class="player-avatar-small">
                                    <img src="${getAvatarUrl(p2)}" alt="${p2.name}">
                                </div>
                                <div class="player-name-small">${p2.name}</div>
                                <div class="player-record ${p2Status}">${p2.wins}-${p2.losses}</div>
                            </div>
                        `;

                        matchesDiv.appendChild(matchDiv);
                    });
                }

                roundDiv.appendChild(matchesDiv);
                container.appendChild(roundDiv);
            }
        }

        function renderResults(data) {
            const qualifiedList = document.getElementById('qualified-list');
            const eliminatedList = document.getElementById('eliminated-list');

            const qualified = data.players.filter(p => p.wins >= 3).sort((a, b) => {
                if (b.wins !== a.wins) return b.wins - a.wins;
                return a.losses - b.losses;
            });

            const eliminated = data.players.filter(p => p.losses >= 3).sort((a, b) => {
                if (a.losses !== b.losses) return a.losses - b.losses;
                return b.wins - a.wins;
            });

            qualifiedList.innerHTML = '';
            eliminatedList.innerHTML = '';

            if (qualified.length === 0) {
                qualifiedList.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:2rem;">暂无晋级选手</div>';
            } else {
                qualified.forEach(player => {
                    const badge = getBadgeText(player.wins, player.losses);
                    const div = document.createElement('div');
                    div.className = 'result-player qualified';
                    div.innerHTML = `
                        <div class="result-avatar">
                            <img src="${getAvatarUrl(player)}" alt="${player.name}">
                        </div>
                        <div class="result-info">
                            <div class="result-name">${player.name}</div>
                            <div class="result-record">战绩: ${player.wins}-${player.losses}</div>
                        </div>
                        ${badge ? `<div class="result-badge ${badge.class}">${badge.text}</div>` : ''}
                    `;
                    qualifiedList.appendChild(div);
                });
            }

            if (eliminated.length === 0) {
                eliminatedList.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:2rem;">暂无淘汰选手</div>';
            } else {
                eliminated.forEach(player => {
                    const badge = getBadgeText(player.wins, player.losses);
                    const div = document.createElement('div');
                    div.className = 'result-player eliminated';
                    div.innerHTML = `
                        <div class="result-avatar">
                            <img src="${getAvatarUrl(player)}" alt="${player.name}">
                        </div>
                        <div class="result-info">
                            <div class="result-name">${player.name}</div>
                            <div class="result-record">战绩: ${player.wins}-${player.losses}</div>
                        </div>
                        ${badge ? `<div class="result-badge ${badge.class}">${badge.text}</div>` : ''}
                    `;
                    eliminatedList.appendChild(div);
                });
            }
        }

        async function loadData() {
            try {
                const resp = await fetch(`${API_BASE}/state/${TOURNAMENT_ID}`);
                const data = await resp.json();
                currentData = data;

                renderSwissBracket(data);
                renderResults(data);
            } catch (e) {
                console.error('加载数据失败:', e);
            }
        }

        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
