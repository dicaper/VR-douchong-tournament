    <style>
        :root {
            --bg: #080b12;
            --panel: #111824;
            --card: #182231;
            --inner: #101722;
            --text: #eef4fb;
            --muted: #9aaabd;
            --border: #33445a;
            --blue: #38bdf8;
            --green: #6ee7b7;
            --gold: #fbbf24;
            --red: #fb7185;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--text);
            background: var(--bg);
            font-family: system-ui, "Microsoft YaHei", sans-serif;
        }

        header {
            padding: 38px 16px 28px;
            text-align: center;
            border-bottom: 2px solid var(--blue);
            background: linear-gradient(180deg, #10182a, var(--bg));
        }

        h1 {
            margin: 0;
            color: var(--blue);
            font-size: clamp(28px, 5vw, 48px);
        }

        .subtitle {
            margin-top: 8px;
            color: var(--muted);
        }

        .data-license-top {
            width: min(1100px, 94%);
            margin: 22px auto 0;
            padding: 14px 20px;
            color: var(--muted);
            background: #101722;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.8;
        }

        .data-license-top strong {
            color: var(--text);
        }

        .data-license-top a {
            color: var(--blue);
            text-decoration: none;
        }

        .data-license-top a:hover {
            text-decoration: underline;
        }

        .data-license-top code {
            padding: 2px 5px;
            color: #d7e3f1;
            background: var(--card);
            border-radius: 4px;
        }

        .container {
            width: min(1500px, 96%);
            margin: 0 auto;
            padding: 20px 0 48px;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 22px;
        }

        nav a {
            padding: 9px 17px;
            color: var(--muted);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            text-decoration: none;
        }

        nav a.active,
        nav a:hover {
            color: #06111b;
            background: var(--blue);
        }

        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
            padding: 18px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .status-item {
            text-align: center;
        }

        .status-label {
            color: var(--muted);
            font-size: 13px;
        }

        .status-value {
            margin-top: 5px;
            color: var(--blue);
            font-size: 19px;
            font-weight: 800;
        }

        .bracket-panel {
            padding: 22px;
            overflow-x: auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .bracket {
            display: grid;
            grid-template-columns: repeat(4, minmax(250px, 1fr));
            min-width: 1080px;
            gap: 24px;
            align-items: start;
        }

        .round-column {
            min-width: 0;
        }

        .round-title {
            padding-bottom: 10px;
            margin-bottom: 16px;
            color: var(--blue);
            border-bottom: 1px solid var(--border);
            text-align: center;
            font-size: 16px;
            font-weight: 800;
        }

        .series-card {
            padding: 13px;
            margin-bottom: 26px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .series-card.finished {
            border-color: var(--green);
        }

        .series-header {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding-bottom: 10px;
            margin-bottom: 10px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .series-score {
            color: var(--text);
            font-weight: 800;
            text-align: center;
        }

        .series-status {
            padding: 3px 8px;
            color: #06111b;
            background: var(--gold);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap;
        }

        .series-status.running {
            background: var(--green);
        }

        .series-status.finished {
            background: #a6b3c5;
        }

        .player {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr) auto;
            gap: 9px;
            align-items: center;
            padding: 9px;
            background: var(--inner);
            border: 2px solid transparent;
            border-radius: 8px;
        }

        .player.winner {
            background: rgba(110, 231, 183, .1);
            border-color: var(--green);
        }

        .avatar-link {
            display: block;
            width: 40px;
            height: 40px;
            text-decoration: none;
        }

        .avatar-wrap {
            position: relative;
            width: 40px;
            height: 40px;
        }

        .avatar {
            display: block;
            width: 40px;
            height: 40px;
            object-fit: cover;
            border: 2px solid var(--blue);
            border-radius: 50%;
            transition: transform .15s ease, border-color .15s ease;
        }

        .avatar-link:hover .avatar {
            border-color: var(--green);
            transform: scale(1.08);
        }

        .live-dot {
            position: absolute;
            right: -2px;
            bottom: 0;
            width: 11px;
            height: 11px;
            background: #ef4444;
            border: 2px solid var(--inner);
            border-radius: 50%;
        }

        .player-info {
            min-width: 0;
        }

        .player-name {
            overflow-wrap: anywhere;
            font-weight: 800;
        }

        .live-label {
            display: inline-block;
            padding: 1px 6px;
            margin-left: 5px;
            color: #06111b;
            background: var(--green);
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            vertical-align: middle;
        }

        .player-record {
            color: var(--muted);
            font-size: 12px;
        }

        .game-score {
            color: var(--blue);
            font-size: 18px;
            font-weight: 900;
        }

        .vs {
            padding: 5px;
            color: var(--muted);
            text-align: center;
            font-size: 12px;
            font-weight: 800;
        }

        .game-list {
            padding-top: 9px;
            margin-top: 11px;
            border-top: 1px solid var(--border);
        }

        .game-row {
            display: grid;
            grid-template-columns: 70px minmax(0, 1fr) auto;
            gap: 7px;
            align-items: center;
            padding: 6px 0;
            color: var(--muted);
            font-size: 12px;
        }

        .game-row.active {
            color: var(--blue);
            font-weight: 800;
        }

        .game-row.completed {
            color: var(--green);
        }

        .revenue {
            color: var(--blue);
            font-weight: 700;
            white-space: nowrap;
        }

        .match-time {
            margin-top: 10px;
            color: var(--muted);
            text-align: center;
            font-size: 12px;
        }

        .empty {
            grid-column: 1 / -1;
            padding: 70px 20px;
            color: var(--muted);
            text-align: center;
        }

        footer {
            padding: 22px;
            color: var(--muted);
            border-top: 1px solid var(--border);
            text-align: center;
        }

        @media (max-width: 650px) {
            .bracket-panel {
                padding: 12px;
            }

            .series-header {
                flex-wrap: wrap;
            }
        }

        .history-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0, 0, 0, .78);
        }

        .history-modal.open {
            display: flex;
        }

        .history-modal-content {
            width: min(900px, 100%);
            max-height: 90vh;
            overflow: auto;
            padding: 20px;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--blue);
            border-radius: 14px;
        }

        .history-modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .history-modal-close {
            color: var(--muted);
            background: transparent;
            border: 0;
            font-size: 28px;
            cursor: pointer;
        }

        .series-card.clickable-history {
            cursor: pointer;
        }

        .series-card.clickable-history:hover {
            border-color: var(--blue);
            box-shadow: 0 0 0 1px var(--blue);
        }

        .comparison-table-wrap {
            overflow-x: auto;
            margin-top: 16px;
        }

        .comparison-table {
            width: 100%;
            min-width: 620px;
            border-collapse: collapse;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 9px 10px;
            border-bottom: 1px solid var(--border);
            text-align: right;
        }

        .comparison-table th:first-child,
        .comparison-table td:first-child {
            color: var(--muted);
            text-align: left;
        }

        .comparison-table th {
            color: var(--blue);
        }

        .comparison-section-title {
            margin: 18px 0 8px;
            color: var(--blue);
            font-weight: 800;
        }

        .comparison-note {
            margin-top: 12px;
            color: var(--muted);
            font-size: 12px;
        }

<script>
"use strict";

const API_BASE = "https://vrdouchong-332622-12-1512085171.sh.run.tcloudbase.com/api/tournament";
const TOURNAMENT_ID = 1;
const JPG_PLAYERS = new Set(["Rhea", "Melody"]);

const STAGE_NAMES = {
    100: "八强赛",
    101: "半决赛",
    102: "决赛"
};

function escapeHtml(value) {
    return String(value ?? "").replace(
        /[&<>"']/g,
        char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[char]
    );
}

function avatarUrl(player) {
    if (!player) {
        return "";
    }

    const extension = JPG_PLAYERS.has(player.name)
        ? "jpg"
        : "webp";

    return `/avatars/${encodeURIComponent(player.name)}.${extension}`;
}

function liveUrl(player) {
    if (!player) {
        return "";
    }

    if (player.live_url) {
        return player.live_url;
    }

    if (player.room_id) {
        return `https://live.bilibili.com/${encodeURIComponent(
            player.room_id
        )}`;
    }

    return "";
}

function money(value) {
    return "¥" + Math.round(Number(value || 0))
        .toLocaleString("zh-CN");
}

function beijingTime(value) {
    if (!value) {
        return "";
    }

    const text = String(value).trim();

    // ???/API ??????????????? UTC?
    // ?? Z ?????????????????
    const hasTimezone = /(?:Z|[+-]\d{2}:\d{2})$/i.test(text);
    const normalized = hasTimezone ? text : `${text}Z`;
    const date = new Date(normalized);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    return new Intl.DateTimeFormat("zh-CN", {
        timeZone: "Asia/Shanghai",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
    }).format(date).replaceAll("-", "/");
}
function inferSeriesId(matchId) {
    if (!matchId || !matchId.includes("g")) {
        return null;
    }

    return matchId.split("g")[0];
}

function inferGameNumber(matchId) {
    if (!matchId || !matchId.includes("g")) {
        return null;
    }

    const number = Number(matchId.split("g")[1]);

    return Number.isFinite(number) ? number : null;
}

function groupSeries(data) {
    const seriesMap = new Map();

    for (const match of data.matches) {
        if (Number(match.round) < 100) {
            continue;
        }

        const seriesId = match.series_id || inferSeriesId(match.id);

        if (!seriesId) {
            continue;
        }

        if (!seriesMap.has(seriesId)) {
            seriesMap.set(seriesId, {
                id: seriesId,
                round: Number(match.round),
                games: [],
                player1: match.p1,
                player2: match.p2
            });
        }

        const series = seriesMap.get(seriesId);
        series.games.push(match);
        series.player1 = series.player1 || match.p1;
        series.player2 = series.player2 || match.p2;
    }

    for (const series of seriesMap.values()) {
        series.games.sort((a, b) => {
            const gameA = Number(
                a.game_number || inferGameNumber(a.id) || 1
            );

            const gameB = Number(
                b.game_number || inferGameNumber(b.id) || 1
            );

            return gameA - gameB;
        });

        series.player1Wins = 0;
        series.player2Wins = 0;

        for (const game of series.games) {
            if (game.status !== "completed") {
                continue;
            }

            if (String(game.winner) === String(series.player1)) {
                series.player1Wins += 1;
            }

            if (String(game.winner) === String(series.player2)) {
                series.player2Wins += 1;
            }
        }

        series.winner =
            series.player1Wins >= 2
                ? series.player1
                : series.player2Wins >= 2
                    ? series.player2
                    : null;
    }

    return [...seriesMap.values()];
}

function playerById(data, id) {
    return data.players.find(
        player => String(player.id) === String(id)
    );
}

function renderPlayer(data, playerId, wins, isWinner) {
    const player = playerById(data, playerId);

    if (!player) {
        return `
            <div class="player">
                <div></div>
                <div class="player-info">
                    <div class="player-name">待定</div>
                </div>
                <div class="game-score">-</div>
            </div>
        `;
    }

    const url = liveUrl(player);
    const avatar = `
        <div class="avatar-wrap">
            <img
                class="avatar"
                src="${avatarUrl(player)}"
                alt="${escapeHtml(player.name)}"
            >
            ${player.is_live
                ? '<span class="live-dot"></span>'
                : ""}
        </div>
    `;

    const avatarContent = url
        ? `
            <a
                class="avatar-link"
                href="${escapeHtml(url)}"
                target="_blank"
                rel="noopener noreferrer"
                title="打开 ${escapeHtml(player.name)} 的Bilibili直播间"
            >${avatar}</a>
        `
        : `<div class="avatar-link">${avatar}</div>`;

    return `
        <div class="player ${isWinner ? "winner" : ""}">
            ${avatarContent}

            <div class="player-info">
                <div class="player-name">
                    ${escapeHtml(player.name)}
                    ${player.is_live
                        ? '<span class="live-label">直播中</span>'
                        : ""}
                </div>

                <div class="player-record">
                    瑞士轮战绩
                    ${Number(player.wins || 0)}-${Number(player.losses || 0)}
                </div>
            </div>

            <div class="game-score">${Number(wins || 0)}</div>
        </div>
    `;
}


function comparisonNumber(value) {
    return Number(value || 0).toLocaleString("zh-CN");
}

function comparisonMoney(value) {
    return "&#165;" + Number(value || 0).toLocaleString(
        "zh-CN",
        {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }
    );
}

function comparison指标Rows(player1Name, player2Name, total1, total2) {
    return `
        <tr>
            <td>????</td>
            <td>${comparisonMoney(total1.total)}</td>
            <td>${comparisonMoney(total2.total)}</td>
        </tr>
        <tr>
            <td>SC</td>
            <td>${comparisonMoney(total1.sc)}</td>
            <td>${comparisonMoney(total2.sc)}</td>
        </tr>
        <tr>
            <td>??/??</td>

function getGameRevenue(game, playerId) {
    const revenue = game?.revenue?.[playerId] || {};

    return {
        total: Number(revenue.total || 0),
        sc: Number(revenue.sc || 0),
        gift: Number(revenue.gift || 0),
        danmaku: Number(revenue.danmaku || 0),
        peak: Number(revenue.peak_viewers || 0),
        avg: Number(revenue.avg_viewers || 0)
    };
}

function showSeriesComparison(seriesId) {
    if (!currentData) {
        return;
    }

    const seriesList = groupSeries(currentData);
    const series = seriesList.find(
        item => String(item.id) === String(seriesId)
    );

    if (!series || !series.games.length) {
        return;
    }

    const player1 = playerById(
        currentData,
        series.player1
    );
    const player2 = playerById(
        currentData,
        series.player2
    );

    if (!player1 || !player2) {
        return;
    }

    const total1 = {
        total: 0,
        sc: 0,
        gift: 0,
        danmaku: 0,
        peak: 0,
        avgSum: 0,
        avgCount: 0
    };

    const total2 = {
        total: 0,
        sc: 0,
        gift: 0,
        danmaku: 0,
        peak: 0,
        avgSum: 0,
        avgCount: 0
    };

    const gameRows = series.games.map((game, index) => {
        const r1 = getGameRevenue(game, series.player1);
        const r2 = getGameRevenue(game, series.player2);

        for (const [target, value] of [
            [total1, r1],
            [total2, r2]
        ]) {
            target.total += value.total;
            target.sc += value.sc;
            target.gift += value.gift;
            target.danmaku += value.danmaku;
            target.peak = Math.max(target.peak, value.peak);

            if (value.avg > 0) {
                target.avgSum += value.avg;
                target.avgCount += 1;
            }
        }

        const winner = game.winner
            ? playerById(currentData, game.winner)
            : null;

        const gameNumber = Number(
            game.game_number || index + 1
        );

        return `
            <tr>
                <td>?${gameNumber}?</td>
                <td>
                    ${escapeHtml(winner?.name || "???")}
                </td>
                <td>${comparisonMoney(r1.total)}</td>
                <td>${comparisonMoney(r2.total)}</td>
                <td>${comparisonNumber(r1.danmaku)}</td>
                <td>${comparisonNumber(r2.danmaku)}</td>
                <td>${comparisonNumber(r1.peak)}</td>
                <td>${comparisonNumber(r2.peak)}</td>
            </tr>
        `;
    }).join("");

    total1.avg = total1.avgCount
        ? Math.round(total1.avgSum / total1.avgCount)
        : 0;

    total2.avg = total2.avgCount
        ? Math.round(total2.avgSum / total2.avgCount)
        : 0;

    document.getElementById(
        "history-comparison-title"
    ).textContent =
        `${player1.name} ${series.player1Wins} : ` +
        `${series.player2Wins} ${player2.name}`;

    document.getElementById(
        "history-comparison-body"
    ).innerHTML = `
        <div class="comparison-section-title">
            ???????
        </div>

        <div class="comparison-table-wrap">
            <table class="comparison-table">
                <thead>
                    <tr>
                        <th>??</th>
                        <th>${escapeHtml(player1.name)}</th>
                        <th>${escapeHtml(player2.name)}</th>
                    </tr>
                </thead>
                <tbody>
                    ${comparison指标Rows(
                        player1.name,
                        player2.name,
                        total1,
                        total2
                    )}
                </tbody>
            </table>
        </div>

        <div class="comparison-section-title">
            ????
        </div>

        <div class="comparison-table-wrap">
            <table class="comparison-table">
                <thead>
                    <tr>
                        <th>??</th>
                        <th>??</th>
                        <th>${escapeHtml(player1.name)} ??</th>
                        <th>${escapeHtml(player2.name)} ??</th>
                        <th>${escapeHtml(player1.name)} ??</th>
                        <th>${escapeHtml(player2.name)} ??</th>
                        <th>${escapeHtml(player1.name)} ??</th>
                        <th>${escapeHtml(player2.name)} ??</th>
                    </tr>
                </thead>
                <tbody>
                    ${gameRows}
                </tbody>
            </table>
        </div>

        <div class="comparison-note">
            ?????????????/????????????
        </div>
    `;

    document.getElementById(
        "history-comparison-modal"
    ).classList.add("open");
}

function closeSeriesComparison() {
    document.getElementById(
        "history-comparison-modal"
    ).classList.remove("open");
}

function renderSeries(data, series) {
    const firstGame = series.games[0];

    if (!firstGame) {
        return "";
    }

    const isFinished = Boolean(series.winner);
    const statusText = isFinished ? "系列赛结束" : "进行中";
    const statusClass = isFinished ? "finished" : "running";

    const firstPlayer = playerById(data, series.player1);
    const secondPlayer = playerById(data, series.player2);

    const gameRows = series.games.map(game => {
        const gameNumber = Number(
            game.game_number || inferGameNumber(game.id) || 1
        );

        const completed = game.status === "completed";
        const winnerName = game.winner
            ? playerById(data, game.winner)?.name || game.winner
            : "进行中";

        const p1Revenue = game.revenue?.[game.p1]?.total || 0;
        const p2Revenue = game.revenue?.[game.p2]?.total || 0;

        return `
            <div class="game-row ${completed ? "completed" : "active"}">
                <span>第${gameNumber}局</span>
                <span>
                    ${completed
                        ? `${escapeHtml(winnerName)} 获胜`
                        : "当前进行中"}
                </span>
                <span class="revenue">
                    ${money(p1Revenue)} : ${money(p2Revenue)}
                </span>
            </div>
        `;
    }).join("");

    const currentGame = series.games.find(
        game => game.status === "running"
    );

    const timeText = currentGame
        ? `比赛时间：${beijingTime(currentGame.start_time)} - ${beijingTime(currentGame.end_time)}`
        : "";

    return `
        <article
            class="series-card ${isFinished ? "finished" : ""} clickable-history"
            data-series-id="${escapeHtml(series.id)}"
            onclick="if (!event.target.closest('a,button')) showSeriesComparison('${escapeHtml(series.id)}')"
        >
            <div class="series-header">
                <span>${escapeHtml(series.id.toUpperCase())}</span>

                <span class="series-score">
                    ${escapeHtml(firstPlayer?.name || "待定")}
                    ${series.player1Wins}
                    :
                    ${series.player2Wins}
                    ${escapeHtml(secondPlayer?.name || "待定")}
                </span>

                <span class="series-status ${statusClass}">
                    ${statusText}
                </span>
            </div>

            ${renderPlayer(
                data,
                series.player1,
                series.player1Wins,
                String(series.winner) === String(series.player1)
            )}

            <div class="vs">BO3 · 先赢2局</div>

            ${renderPlayer(
                data,
                series.player2,
                series.player2Wins,
                String(series.winner) === String(series.player2)
            )}

            <div class="game-list">
                ${gameRows}
            </div>

            ${timeText
                ? `<div class="match-time">${escapeHtml(timeText)}</div>`
                : ""}
        </article>
    `;
}

function renderBracket(data) {
    const bracket = document.getElementById("bracket");
    const seriesList = groupSeries(data);

    if (!seriesList.length) {
        bracket.innerHTML = `
            <div class="empty">
                ????????? BO3 ?????????
            </div>
        `;
        return;
    }

    const rounds = {
        100: [],
        101: [],
        102: []
    };

    for (const series of seriesList) {
        if (!rounds[series.round]) {
            rounds[series.round] = [];
        }

        rounds[series.round].push(series);
    }

    const renderRound = (roundNumber, title) => {
        const list = rounds[roundNumber] || [];

        if (!list.length) {
            return `
                <div class="round-column">
                    <div class="round-title">${title}</div>
                    <div class="empty">??</div>
                </div>
            `;
        }

        return `
            <div class="round-column">
                <div class="round-title">${title}</div>
                ${list.map(series => renderSeries(data, series)).join("")}
            </div>
        `;
    };

    const finalSeries = seriesList.find(
        series => Number(series.round) === 102
    );

    const champion = finalSeries?.winner
        ? playerById(data, finalSeries.winner)
        : null;

    let championColumn;

    if (champion) {
        const url = liveUrl(champion);

        championColumn = `
            <div class="round-column">
                <div class="round-title">&#20896;&#20891;</div>
                <article class="series-card finished"
                    style="text-align:center;padding:24px 14px">
                    <div style="
                        color:var(--gold);
                        font-size:32px;
                        margin-bottom:12px
                    ">&#127942;</div>

                    ${url ? `
                        <a
                            href="${escapeHtml(url)}"
                            target="_blank"
                            rel="noopener noreferrer"
                            title="Open ${escapeHtml(champion.name)}'s Bilibili live room"
                            style="display:inline-block"
                        >
                            <img
                                class="avatar"
                                src="${avatarUrl(champion)}"
                                alt="${escapeHtml(champion.name)}"
                                style="width:72px;height:72px"
                            >
                        </a>
                    ` : `
                        <img
                            class="avatar"
                            src="${avatarUrl(champion)}"
                            alt="${escapeHtml(champion.name)}"
                            style="width:72px;height:72px"
                        >
                    `}

                    <div class="player-name" style="margin-top:12px">
                        ${escapeHtml(champion.name)}
                        ${champion.is_live
                            ? '<span class="live-label">&#30452;&#25773;&#20013;</span>'
                            : ""}
                    </div>

                    <div class="player-record" style="margin-top:6px">
                        BO3 &#31995;&#21015;&#36187;&#33719;&#32988;
                    </div>
                </article>
            </div>
        `;
    } else {
        championColumn = `
            <div class="round-column">
                <div class="round-title">&#20896;&#20891;</div>
                <div class="empty">
                    The champion will appear after the final.
                </div>
            </div>
        `;
    }

    bracket.innerHTML = `
        ${renderRound(100, "?? BO3")}
        ${renderRound(101, "??? BO3")}
        ${renderRound(102, "?? BO3")}
        ${championColumn}
    `;
}

function getVisitorId() {
    const key = "vr-page-viewer-id";

    try {
        let id = localStorage.getItem(key);

        if (!id) {
            id = crypto.randomUUID();
            localStorage.setItem(key, id);
        }

        return id;
    } catch {
        return "temporary-" + Math.random().toString(36);
    }
}

function recordPageView() {
    fetch("/api/analytics/visit", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            page: window.location.pathname,
            visitor_id: getVisitorId()
        }),
        keepalive: true
    }).catch(() => {
        // 访问统计失败不影响比赛页面。
    });
}

async function loadData() {
    try {
        const response = await fetch(
            `${API_BASE}/state/${TOURNAMENT_ID}`,
            {cache: "no-store"}
        );

        if (!response.ok) {
            throw new Error(`服务器返回 ${response.status}`);
        }

        const data = await response.json();

        if (
            !data.tournament
            || !Array.isArray(data.players)
            || !Array.isArray(data.matches)
        ) {
            throw new Error("服务器返回的数据格式不正确");
        }

        const round = Number(data.tournament.current_round);

        document.getElementById("event-status").textContent =
            data.tournament.status === "running"
                ? "进行中"
                : data.tournament.status === "pending"
                    ? "未开始"
                    : data.tournament.status === "finished"
                        ? "已结束"
                        : String(data.tournament.status || "--");

        document.getElementById("stage-status").textContent =
            STAGE_NAMES[round] || "瑞士轮";

        document.getElementById("updated-time").textContent =
            new Intl.DateTimeFormat("zh-CN", {
                timeZone: "Asia/Shanghai",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }).format(new Date());

        renderBracket(data);
    } catch (error) {
        console.error("加载淘汰赛数据失败：", error);

        document.getElementById("bracket").innerHTML = `
            <div class="empty">
                读取淘汰赛数据失败：${escapeHtml(error.message)}
            </div>
        `;
    }
}


document.getElementById(
    "history-comparison-modal"
).addEventListener("click", event => {
    if (event.target.id === "history-comparison-modal") {
        closeSeriesComparison();
    }
});

recordPageView();
loadData();

let refreshTimer = null;

function startAutoRefresh() {
    if (refreshTimer !== null) {
        return;
    }

    refreshTimer = setInterval(
        loadData,
        120000
    );
}

function stopAutoRefresh() {
    if (refreshTimer === null) {
        return;
    }

    clearInterval(refreshTimer);
    refreshTimer = null;
}

document.addEventListener(
    "visibilitychange",
    () => {
        if (document.hidden) {
            stopAutoRefresh();
        } else {
            loadData();
            startAutoRefresh();
        }
    }
);

startAutoRefresh();
</script>
